esphome:
  name: apollo-msr-1
  friendly_name: Apollo Multisensor Mk1 (MSR-1)
  comment: Apollo Multisensor Mk1 (MSR-1)
  name_add_mac_suffix: true
  on_boot:
  - priority: 900.0
    then:
      - lambda: |-
          id(radar_bluetooth).turn_off();
  - priority: 500
    then:
      - text_sensor.template.publish:
          id: apollo_firmware_version
          state: "${version}"

  project:
    name: "ApolloAutomation.MSR-1_Factory"
    version: "${version}"

  min_version: 2025.11.0

dashboard_import:
  package_import_url: github://ApolloAutomation/MSR-1/Integrations/ESPHome/MSR-1.yaml
  import_full_config: false

improv_serial:

esp32_improv:
  authorizer: none

wifi:
  on_connect:
    - component.update: update_http_request
  ap:
    ssid: "Apollo MSR1 Hotspot"

logger:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect whose signed
  # Location header exceeds the 512-byte default and fails with
  # "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 2048

safe_mode:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://apolloautomation.github.io/MSR-1/firmware/manifest.json

packages:
  core: !include Core.yaml