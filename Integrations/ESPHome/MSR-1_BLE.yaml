substitutions:
  ble_firmware: "true"

esphome:
  name: apollo-msr-1
  friendly_name: Apollo Multisensor Mk1 (MSR-1)
  comment: Apollo Multisensor Mk1 (MSR-1)
  name_add_mac_suffix: true
  on_boot:
  - priority: 900.0
    then:
      - lambda: |-
          id(radar_bluetooth).turn_off();
  - priority: 500
    then:
      - text_sensor.template.publish:
          id: apollo_firmware_version
          state: "${version}"

  project:
    name: "ApolloAutomation.MSR-1_BLE"
    version: "${version}"

  min_version: 2025.11.0

logger:

dashboard_import:
  package_import_url: github://ApolloAutomation/MSR-1/Integrations/ESPHome/MSR-1_BLE.yaml
  import_full_config: false


ota:
  - platform: esphome
    password: ${ota_password}
  - platform: http_request
    id: ota_managed

wifi:
  on_connect:
    - component.update: update_http_request
  ap:
    ssid: "Apollo MSR1 Hotspot"

bluetooth_proxy:
  active: true

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://apolloautomation.github.io/MSR-1/firmware-ble/manifest.json

packages:
  core: !include Core.yaml