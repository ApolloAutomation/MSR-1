name: Build and Publish Beta

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
      # A push that only changes this file must rebuild too
      - '.github/workflows/build-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    uses: ApolloAutomation/Workflows/.github/workflows/build-beta.yml@main
    with:
      # Beta serves OTA updates only, so the first-flash Factory image is not built.
      # Keys match the manifest-<key>.json URLs in Core.yaml and MSR-1_BLE.yaml.
      variants: >-
        [{"key": "standard", "yaml": "Integrations/ESPHome/MSR-1.yaml",     "name": "firmware-standard"},
         {"key": "ble",      "yaml": "Integrations/ESPHome/MSR-1_BLE.yaml", "name": "firmware-ble-beta"}]
