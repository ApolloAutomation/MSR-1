name: Auto Assign

# pull_request_target (not pull_request) so auto-assign works on fork PRs too:
# forks get a read-only token on pull_request and cannot be assigned. Safe here
# because this only assigns a user and never checks out or runs PR code.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    uses: ApolloAutomation/Workflows/.github/workflows/autoassign.yml@430d90dc695c6f7d1075c4e4a0df4b13a6496252 # main 2026-07-23
    with:
      assignees: bharvey88
      num-of-assignees: 1
